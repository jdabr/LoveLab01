{% extends "base.html" %}

{% block content %}
        <div id="message-container">
            {% for message in messages %}
            <div class="message {% if message.role == 'user' %}user-message{% else %}assistant-message{% endif %}">
                {{ message.content }}
            </div>
            {% endfor %}
        </div>

        <div class="input-container">
            <form id="chat-form">
                <div class="input-wrapper">
                    <input type="text" id="input-message" name="message" maxlength="1000" autocomplete="off" placeholder="Type your message here">
                    <input type="submit" value="Send">
                </div>
            </form>
            <div class="terms-container">
                <input type="checkbox" id="terms" name="terms">
                <label for="terms">I&#39;m 18 or older and agree to the Terms and Conditions</label>
                <button id="terms-button">Terms and Conditions</button>
            </div>
        </div>
{% endblock %}
